server:
  port: 8080

spring:
  application:
    name: meetingmind-backend
  profiles:
    default: local
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

meetingmind:
  ai:
    service-token: ${AI_INTERNAL_SERVICE_TOKEN:}
  core-auth:
    target:
      enabled: ${CORE_AUTH_TARGET_ENABLED:false}
      issuer: ${CORE_AUTH_TARGET_ISSUER:https://auth.meetingmind.internal}
      jwks-uri: ${CORE_AUTH_TARGET_JWKS_URI:http://127.0.0.1:8082/.well-known/jwks.json}
      jwks-request-timeout: ${CORE_AUTH_TARGET_JWKS_REQUEST_TIMEOUT:2s}
    outbox:
      auth-principal: ${CORE_AUTH_OUTBOX_AUTH_PRINCIPAL:spiffe://meetingmind.internal/ns/meetingmind/sa/meetingmind-auth}
      allow-test-header: ${CORE_AUTH_OUTBOX_ALLOW_TEST_HEADER:false}

---
spring:
  config:
    activate:
      on-profile: "!local & !db"
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

---
spring:
  config:
    activate:
      on-profile: db
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
