server:
  port: 8080

spring:
  application:
    name: meetingmind-backend
  profiles:
    default: local
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

meetingmind:
  auth:
    validation-mode: ${MEETINGMIND_AUTH_VALIDATION_MODE:DUAL}
    target:
      issuer: ${MEETINGMIND_AUTH_TARGET_ISSUER:https://auth.meetingmind.internal}
      audience: meetingmind-core
      jwks-uri: ${MEETINGMIND_AUTH_JWKS_URI:http://127.0.0.1:8082/.well-known/jwks.json}
      jwks-request-timeout: ${MEETINGMIND_AUTH_JWKS_TIMEOUT:2s}
      allow-test-principal-header: ${MEETINGMIND_AUTH_ALLOW_TEST_PRINCIPAL_HEADER:false}
      test-principal: ${MEETINGMIND_AUTH_TEST_PRINCIPAL:}
    workload:
      allowed-principals: ${MEETINGMIND_CORE_ALLOWED_PRINCIPALS:spiffe://meetingmind.internal/ns/meetingmind/sa/meetingmind-bff}
      allow-test-principal-header: ${MEETINGMIND_CORE_ALLOW_TEST_PRINCIPAL_HEADER:false}
  ai:
    service-token: ${AI_INTERNAL_SERVICE_TOKEN:}

---
spring:
  config:
    activate:
      on-profile: "!local & !db"
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

---
spring:
  config:
    activate:
      on-profile: db
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
