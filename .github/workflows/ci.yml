name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test and package Backend
        run: ./gradlew test bootJar

      - name: Verify bootJar
        run: test -n "$(find build/libs -name '*.jar' ! -name '*-plain.jar' -print -quit)"

  bff:
    name: Web BFF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: bff
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test and package Web BFF
        env:
          BFF_REDIS_INTEGRATION: "true"
          BFF_REDIS_PORT: "6379"
        run: ./gradlew clean test bootJar

      - name: Verify bootJar
        run: test -n "$(find build/libs -name '*.jar' ! -name '*-plain.jar' -print -quit)"

      - name: Run BFF to current Backend compatibility E2E
        env:
          BFF_REDIS_HOST: "127.0.0.1"
          BFF_REDIS_PORT: "6379"
        run: ../scripts/bff-backend-compat-e2e.sh

  auth:
    name: Auth Service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: meetingmind_auth_ci
          POSTGRES_USER: meetingmind_auth_migrator
          POSTGRES_PASSWORD: meetingmind_auth_migrator_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meetingmind_auth_migrator -d meetingmind_auth_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: auth
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test Auth foundation, runtime and PostgreSQL privileges
        env:
          AUTH_DB_INTEGRATION: "true"
          AUTH_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/meetingmind_auth_ci
          AUTH_TEST_MIGRATION_USER: meetingmind_auth_migrator
          AUTH_TEST_MIGRATION_PASSWORD: meetingmind_auth_migrator_ci
          AUTH_TEST_RUNTIME_USER: meetingmind_auth_app
          AUTH_TEST_RUNTIME_PASSWORD: meetingmind_auth_app_ci
        run: ./gradlew clean test bootJar

      - name: Verify bootJar
        run: test -n "$(find build/libs -name '*.jar' ! -name '*-plain.jar' -print -quit)"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Frontend
        run: npm run lint

      - name: Run Frontend unit tests
        run: npm run test

      - name: Build Frontend
        run: npm run build

  ai:
    name: AI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install dependencies
        run: pip install --requirement requirements.txt

      - name: Compile AI service
        run: python -m compileall app tests

      - name: Run AI unit tests
        run: python -m unittest discover -s tests

  migration:
    name: PostgreSQL Migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm
        env:
          POSTGRES_DB: meetingmind_ci
          POSTGRES_USER: meetingmind
          POSTGRES_PASSWORD: meetingmind_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meetingmind -d meetingmind_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Apply and verify Flyway V1-V10
        env:
          CI_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/meetingmind_ci
          CI_POSTGRES_USER: meetingmind
          CI_POSTGRES_PASSWORD: meetingmind_ci_password
        run: ./gradlew test --tests com.meetingmind.demo.MigrationIntegrationTest

  playwright:
    name: Playwright
    needs:
      - backend
      - bff
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run login and meeting access E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  containers:
    name: Container Images
    needs:
      - backend
      - bff
      - auth
      - ai
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      backend_digest: ${{ steps.digests.outputs.backend }}
      bff_digest: ${{ steps.digests.outputs.bff }}
      auth_digest: ${{ steps.digests.outputs.auth }}
      ai_digest: ${{ steps.digests.outputs.ai }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build Backend image
        run: docker build --tag meetingmind-backend:ci backend

      - name: Build Web BFF image
        run: docker build --tag meetingmind-bff:ci bff

      - name: Build Auth Service image
        run: docker build --tag meetingmind-auth:ci auth

      - name: Build AI image
        run: docker build --tag meetingmind-ai:ci ai

      - name: Capture image content digests
        id: digests
        run: |
          echo "backend=$(docker image inspect meetingmind-backend:ci --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          echo "bff=$(docker image inspect meetingmind-bff:ci --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          echo "auth=$(docker image inspect meetingmind-auth:ci --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          echo "ai=$(docker image inspect meetingmind-ai:ci --format '{{.Id}}')" >> "$GITHUB_OUTPUT"

      - name: Install checksum-verified Trivy
        env:
          TRIVY_VERSION: 0.72.0
          TRIVY_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/trivy.tar.gz --directory /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy

      - name: Scan Backend image
        run: trivy image --exit-code 1 --ignore-unfixed --no-progress --scanners vuln --severity HIGH,CRITICAL meetingmind-backend:ci

      - name: Scan Web BFF image
        run: trivy image --exit-code 1 --ignore-unfixed --no-progress --scanners vuln --severity HIGH,CRITICAL meetingmind-bff:ci

      - name: Scan Auth Service image
        run: trivy image --exit-code 1 --ignore-unfixed --no-progress --scanners vuln --severity HIGH,CRITICAL meetingmind-auth:ci

      - name: Scan AI image
        run: trivy image --exit-code 1 --ignore-unfixed --no-progress --scanners vuln --severity HIGH,CRITICAL meetingmind-ai:ci

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan repository history
        run: gitleaks git . --redact --no-banner

  gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - backend
      - bff
      - auth
      - frontend
      - ai
      - migration
      - playwright
      - containers
      - secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write CI summary
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          BFF_RESULT: ${{ needs.bff.result }}
          AUTH_RESULT: ${{ needs.auth.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          AI_RESULT: ${{ needs.ai.result }}
          MIGRATION_RESULT: ${{ needs.migration.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          BACKEND_DIGEST: ${{ needs.containers.outputs.backend_digest }}
          BFF_DIGEST: ${{ needs.containers.outputs.bff_digest }}
          AUTH_DIGEST: ${{ needs.containers.outputs.auth_digest }}
          AI_DIGEST: ${{ needs.containers.outputs.ai_digest }}
        run: |
          {
            echo "## MeetingMind CI"
            echo
            echo "| Check | Scope | Result |"
            echo "| --- | --- | --- |"
            echo "| Backend | test + bootJar | ${BACKEND_RESULT} |"
            echo "| Web BFF | Redis session integration + bootJar | ${BFF_RESULT} |"
            echo "| Auth Service | PostgreSQL migration + least-privilege + bootJar | ${AUTH_RESULT} |"
            echo "| Frontend | lint + unit + build | ${FRONTEND_RESULT} |"
            echo "| AI | compile + unit | ${AI_RESULT} |"
            echo "| PostgreSQL | Flyway V1-V10 + pgvector | ${MIGRATION_RESULT} |"
            echo "| Playwright | login + meeting allow/deny | ${PLAYWRIGHT_RESULT} |"
            echo "| Containers | build + HIGH/CRITICAL scan | ${CONTAINERS_RESULT} |"
            echo "| Secrets | full history | ${SECRETS_RESULT} |"
            echo
            echo "### Image content digests"
            echo
            echo "- Backend: \`${BACKEND_DIGEST:-not-produced}\`"
            echo "- Web BFF: \`${BFF_DIGEST:-not-produced}\`"
            echo "- Auth Service: \`${AUTH_DIGEST:-not-produced}\`"
            echo "- AI: \`${AI_DIGEST:-not-produced}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce required results
        env:
          RESULTS: >-
            ${{ needs.backend.result }}
            ${{ needs.bff.result }}
            ${{ needs.auth.result }}
            ${{ needs.frontend.result }}
            ${{ needs.ai.result }}
            ${{ needs.migration.result }}
            ${{ needs.playwright.result }}
            ${{ needs.containers.result }}
            ${{ needs.secrets.result }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Required CI job did not succeed: $result" >&2
              exit 1
            fi
          done
