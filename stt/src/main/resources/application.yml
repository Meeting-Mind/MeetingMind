server:
  port: 8081

spring:
  application:
    name: meetingmind-stt
  # 공통 Compose 값은 루트 .env, STT 전용 값은 stt/.env에서 읽는다.
  config:
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  profiles:
    default: local
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

meetingmind:
  auth:
    workload:
      allowed-principals: ${MEETINGMIND_STT_ALLOWED_PRINCIPALS:spiffe://meetingmind.internal/ns/meetingmind/sa/meetingmind-core}
      allow-test-principal-header: ${MEETINGMIND_STT_ALLOW_TEST_PRINCIPAL_HEADER:false}

---
spring:
  config:
    activate:
      on-profile: "!local & !db"
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

---
spring:
  config:
    activate:
      on-profile: db
  datasource:
    url: ${STT_DATASOURCE_URL}
    username: ${STT_DATASOURCE_USERNAME}
    password: ${STT_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
