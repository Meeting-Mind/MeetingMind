plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
}

group = 'com.meetingmind'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    migration {
        java.srcDir 'src/migration/java'
    }
}

configurations {
    migrationImplementation.extendsFrom implementation
    migrationRuntimeOnly.extendsFrom runtimeOnly
}

ext {
    tomcatVersion = '10.1.55'
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation platform('software.amazon.awssdk:bom:2.46.8')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation "org.apache.tomcat.embed:tomcat-embed-core:${tomcatVersion}"
    implementation "org.apache.tomcat.embed:tomcat-embed-el:${tomcatVersion}"
    implementation "org.apache.tomcat.embed:tomcat-embed-websocket:${tomcatVersion}"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.4'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.flywaydb:flyway-core'
    implementation 'software.amazon.awssdk:kms'
    implementation 'software.amazon.awssdk:url-connection-client'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql:42.7.11'

    testImplementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

sourceSets.test.compileClasspath += sourceSets.migration.output
sourceSets.test.runtimeClasspath += sourceSets.migration.output

tasks.named('compileTestJava') {
    dependsOn tasks.named('compileMigrationJava')
}

tasks.register('migrateLegacyAuthData', JavaExec) {
    group = 'application'
    description = 'Dry-run, apply, or verify the legacy User/AuthIdentity migration.'
    classpath = sourceSets.migration.runtimeClasspath
    mainClass = 'com.meetingmind.auth.migration.LegacyAuthDataMigration'
}
