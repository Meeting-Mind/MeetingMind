server:
  port: ${AUTH_SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: meetingmind-auth-service
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${AUTH_DB_URL}
    username: meetingmind_auth_app
    password: ${AUTH_DB_RUNTIME_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${AUTH_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${AUTH_DB_POOL_MIN_IDLE:1}
      connection-timeout: ${AUTH_DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${AUTH_DB_VALIDATION_TIMEOUT_MS:1000}
  flyway:
    enabled: true
    url: ${AUTH_DB_URL}
    user: ${AUTH_DB_MIGRATION_USER}
    password: ${AUTH_DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false

meetingmind:
  auth:
    refresh-hash-secret: ${AUTH_REFRESH_HASH_SECRET}
    refresh-ttl: 14d
    password-bcrypt-cost: ${AUTH_PASSWORD_BCRYPT_COST:12}
    recent-auth-window: 10m
    access-deny-window: 11m
    signing:
      provider: ${AUTH_SIGNING_PROVIDER:disabled}
      issuer: ${AUTH_SIGNING_ISSUER:https://auth.meetingmind.internal}
      key-ring-json: ${AUTH_SIGNING_KEY_RING_JSON:}
    google:
      client-ids: ${AUTH_GOOGLE_CLIENT_IDS:}
      jwks-uri: ${AUTH_GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
      connect-timeout: 1s
      request-timeout: 2s
      maximum-cache-ttl: 1h
    workload:
      allowed-principals: ${AUTH_BFF_SPIFFE_PRINCIPALS:spiffe://meetingmind.internal/ns/meetingmind/sa/meetingmind-bff}
      jwks-principals: ${AUTH_JWKS_SPIFFE_PRINCIPALS:spiffe://meetingmind.internal/ns/meetingmind/sa/meetingmind-bff,spiffe://meetingmind.internal/ns/meetingmind/sa/meetingmind-core,spiffe://meetingmind.internal/ns/meetingmind/sa/meetingmind-ai,spiffe://meetingmind.internal/ns/meetingmind/sa/meetingmind-livekit}
      allow-test-header: false
    withdrawal-reconciliation:
      enabled: ${AUTH_WITHDRAWAL_RECONCILIATION_ENABLED:false}
      core-base-url: ${AUTH_WITHDRAWAL_RECONCILIATION_CORE_BASE_URL:}
      fixed-delay: ${AUTH_WITHDRAWAL_RECONCILIATION_FIXED_DELAY:30s}
      test-workload-principal: ${AUTH_WITHDRAWAL_RECONCILIATION_TEST_WORKLOAD_PRINCIPAL:}
    profile-image-storage:
      enabled: ${AUTH_PROFILE_IMAGE_STORAGE_ENABLED:false}
      bucket: ${AUTH_PROFILE_IMAGE_STORAGE_BUCKET:}
      region: ${AUTH_PROFILE_IMAGE_STORAGE_REGION:us-east-1}
      endpoint: ${AUTH_PROFILE_IMAGE_STORAGE_ENDPOINT:}
      access-key: ${AUTH_PROFILE_IMAGE_STORAGE_ACCESS_KEY:}
      secret-key: ${AUTH_PROFILE_IMAGE_STORAGE_SECRET_KEY:}
      path-style-access: ${AUTH_PROFILE_IMAGE_STORAGE_PATH_STYLE_ACCESS:false}
      create-bucket-if-missing: ${AUTH_PROFILE_IMAGE_STORAGE_CREATE_BUCKET_IF_MISSING:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
