services:
  meetingmind-db:
    image: pgvector/pgvector:pg16
    container_name: meetingmind-postgres-local
    environment:
      POSTGRES_DB: ${MEETINGMIND_DB_NAME:-meetingmind}
      POSTGRES_USER: ${MEETINGMIND_DB_USER:-meetingmind}
      POSTGRES_PASSWORD: ${MEETINGMIND_DB_PASSWORD:-meetingmind_local}
    ports:
      - "${MEETINGMIND_DB_PORT:-5434}:5432"
    volumes:
      - meetingmind-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  meetingmind-auth-db:
    profiles: ["auth"]
    image: postgres:16-alpine
    container_name: meetingmind-auth-postgres-local
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-meetingmind_auth}
      POSTGRES_USER: ${AUTH_DB_MIGRATION_USER:-meetingmind_auth_migrator}
      POSTGRES_PASSWORD: ${AUTH_DB_MIGRATION_PASSWORD:-meetingmind_auth_migrator_local}
      AUTH_DB_RUNTIME_PASSWORD: ${AUTH_DB_RUNTIME_PASSWORD:-meetingmind_auth_app_local}
    ports:
      - "${AUTH_DB_PORT:-5435}:5432"
    volumes:
      - meetingmind-auth-postgres-data:/var/lib/postgresql/data
      - ./auth/docker/postgres/init-runtime-user.sh:/docker-entrypoint-initdb.d/10-auth-runtime-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10

  meetingmind-object-storage:
    profiles: ["auth"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: meetingmind-minio-local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AUTH_PROFILE_IMAGE_STORAGE_ACCESS_KEY:-meetingmind-local}
      MINIO_ROOT_PASSWORD: ${AUTH_PROFILE_IMAGE_STORAGE_SECRET_KEY:-meetingmind-local-secret}
    ports:
      - "${AUTH_PROFILE_IMAGE_STORAGE_PORT:-9000}:9000"
      - "${AUTH_PROFILE_IMAGE_STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - meetingmind-object-storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  meetingmind-redis:
    image: redis:7-alpine
    container_name: meetingmind-redis-local
    ports:
      - "${MEETINGMIND_REDIS_PORT:-6380}:6379"
    volumes:
      - meetingmind-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meetingmind-bff:
    profiles: ["bff"]
    build:
      context: ./bff
    environment:
      BFF_REDIS_HOST: meetingmind-redis
      BFF_REDIS_PORT: 6379
      BFF_ACCEPT_BROWSER_TRAFFIC: ${BFF_ACCEPT_BROWSER_TRAFFIC:-true}
      BFF_TOKEN_VAULT_LOCAL_KEY_BASE64: ${BFF_TOKEN_VAULT_LOCAL_KEY_BASE64:-}
      BFF_BACKEND_BASE_URL: ${BFF_BACKEND_BASE_URL:-http://host.docker.internal:8080}
    ports:
      - "${MEETINGMIND_BFF_PORT:-8081}:8081"
    depends_on:
      meetingmind-redis:
        condition: service_healthy

  meetingmind-auth:
    profiles: ["auth"]
    build:
      context: ./auth
    environment:
      AUTH_DB_URL: jdbc:postgresql://meetingmind-auth-db:5432/${AUTH_DB_NAME:-meetingmind_auth}
      AUTH_DB_RUNTIME_PASSWORD: ${AUTH_DB_RUNTIME_PASSWORD:-meetingmind_auth_app_local}
      AUTH_DB_MIGRATION_USER: ${AUTH_DB_MIGRATION_USER:-meetingmind_auth_migrator}
      AUTH_DB_MIGRATION_PASSWORD: ${AUTH_DB_MIGRATION_PASSWORD:-meetingmind_auth_migrator_local}
      AUTH_REFRESH_HASH_SECRET: ${AUTH_REFRESH_HASH_SECRET:-local-only-refresh-hash-secret-change-me}
      AUTH_PASSWORD_BCRYPT_COST: ${AUTH_PASSWORD_BCRYPT_COST:-12}
      AUTH_GOOGLE_CLIENT_IDS: ${AUTH_GOOGLE_CLIENT_IDS:-}
      AUTH_ALLOW_TEST_WORKLOAD_HEADER: ${AUTH_ALLOW_TEST_WORKLOAD_HEADER:-true}
      AUTH_SIGNING_PROVIDER: ${AUTH_SIGNING_PROVIDER:-disabled}
      AUTH_SIGNING_ISSUER: ${AUTH_SIGNING_ISSUER:-https://auth.meetingmind.internal}
      AUTH_SIGNING_KEY_RING_JSON: ${AUTH_SIGNING_KEY_RING_JSON:-}
      AUTH_JWKS_SPIFFE_PRINCIPALS: ${AUTH_JWKS_SPIFFE_PRINCIPALS:-spiffe://meetingmind.internal/ns/meetingmind/sa/meetingmind-bff,spiffe://meetingmind.internal/ns/meetingmind/sa/meetingmind-core,spiffe://meetingmind.internal/ns/meetingmind/sa/meetingmind-ai,spiffe://meetingmind.internal/ns/meetingmind/sa/meetingmind-livekit}
      AUTH_PROFILE_IMAGE_STORAGE_ENABLED: ${AUTH_PROFILE_IMAGE_STORAGE_ENABLED:-true}
      AUTH_PROFILE_IMAGE_STORAGE_BUCKET: ${AUTH_PROFILE_IMAGE_STORAGE_BUCKET:-meetingmind-profile-images}
      AUTH_PROFILE_IMAGE_STORAGE_REGION: ${AUTH_PROFILE_IMAGE_STORAGE_REGION:-us-east-1}
      AUTH_PROFILE_IMAGE_STORAGE_ENDPOINT: ${AUTH_PROFILE_IMAGE_STORAGE_ENDPOINT:-http://meetingmind-object-storage:9000}
      AUTH_PROFILE_IMAGE_STORAGE_ACCESS_KEY: ${AUTH_PROFILE_IMAGE_STORAGE_ACCESS_KEY:-meetingmind-local}
      AUTH_PROFILE_IMAGE_STORAGE_SECRET_KEY: ${AUTH_PROFILE_IMAGE_STORAGE_SECRET_KEY:-meetingmind-local-secret}
      AUTH_PROFILE_IMAGE_STORAGE_PATH_STYLE_ACCESS: ${AUTH_PROFILE_IMAGE_STORAGE_PATH_STYLE_ACCESS:-true}
      AUTH_PROFILE_IMAGE_STORAGE_CREATE_BUCKET_IF_MISSING: ${AUTH_PROFILE_IMAGE_STORAGE_CREATE_BUCKET_IF_MISSING:-true}
    ports:
      - "${AUTH_SERVER_PORT:-8082}:8082"
    depends_on:
      meetingmind-auth-db:
        condition: service_healthy
      meetingmind-object-storage:
        condition: service_healthy

  meetingmind-ai-worker:
    profiles: ["ai"]
    build:
      context: ./ai
    command: ["python", "-m", "app.embedding_worker"]
    environment:
      AI_DATABASE_URL: postgresql://${MEETINGMIND_DB_USER:-meetingmind}:${MEETINGMIND_DB_PASSWORD:-meetingmind_local}@meetingmind-db:5432/${MEETINGMIND_DB_NAME:-meetingmind}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSION: ${OPENAI_EMBEDDING_DIMENSION:-1536}
    depends_on:
      meetingmind-db:
        condition: service_healthy

volumes:
  meetingmind-postgres-data:
  meetingmind-auth-postgres-data:
  meetingmind-redis-data:
  meetingmind-object-storage-data:

# docker compose -f compose.local.yml up -d
