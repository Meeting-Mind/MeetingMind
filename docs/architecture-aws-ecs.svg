<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">MeetingMind AWS ECS Fargate Target Architecture</title>
  <desc id="desc">AWS Seoul NonProd Multi-AZ architecture for MeetingMind using ECS Fargate, CloudFront, ALB, BFF, Auth, Core, AI, realtime STT, LiveKit Cloud and service-owned data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <style>
      .label{font-family:Inter,Arial,sans-serif;fill:#e5e7eb}.small{font-size:15px}.tiny{font-size:13px}.title{font-size:28px;font-weight:700}.section{font-size:18px;font-weight:700;fill:#93c5fd}.box{fill:#1e293b;stroke:#64748b;stroke-width:1.5}.service{fill:#172554;stroke:#60a5fa;stroke-width:2}.data{fill:#172e2b;stroke:#34d399;stroke-width:2}.external{fill:#3b234f;stroke:#d8b4fe;stroke-width:2}.platform{fill:#2c2413;stroke:#fbbf24;stroke-width:2}.line{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}.blue{stroke:#38bdf8;stroke-width:2.5;fill:none;marker-end:url(#blueArrow)}.dashed{stroke-dasharray:8 7}.note{fill:#cbd5e1;font-size:12px;font-family:Inter,Arial,sans-serif}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="url(#bg)"/>
  <text x="70" y="58" class="label title">MeetingMind · AWS NonProd Target Architecture</text>
  <text x="70" y="88" class="label small">Seoul ap-northeast-2 · ECS Fargate · Single Region / Multi-AZ · Browser has no access token</text>

  <rect x="55" y="120" width="1690" height="180" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="80" y="151" class="section">Internet &amp; Edge</text>
  <rect x="90" y="185" width="170" height="65" rx="10" class="external" filter="url(#shadow)"/><text x="175" y="213" text-anchor="middle" class="label">사용자 브라우저</text><text x="175" y="234" text-anchor="middle" class="note">same-origin cookie</text>
  <rect x="350" y="185" width="155" height="65" rx="10" class="box"/><text x="427" y="222" text-anchor="middle" class="label">Route 53</text>
  <rect x="595" y="185" width="205" height="65" rx="10" class="box"/><text x="697" y="213" text-anchor="middle" class="label">CloudFront + WAF</text><text x="697" y="234" text-anchor="middle" class="note">target · static + API routing</text>
  <rect x="890" y="185" width="185" height="65" rx="10" class="box"/><text x="982" y="222" text-anchor="middle" class="label">Private S3</text><text x="982" y="241" text-anchor="middle" class="note">React/Vite static assets</text>
  <rect x="1165" y="185" width="185" height="65" rx="10" class="box"/><text x="1257" y="222" text-anchor="middle" class="label">Public ALB</text><text x="1257" y="241" text-anchor="middle" class="note">HTTPS → BFF target</text>
  <path d="M260 217 H350 M505 217 H595 M800 217 H890" class="line"/><path d="M800 217 H1165" class="blue"/><text x="1010" y="207" class="note">/api/*</text>

  <rect x="55" y="340" width="1260" height="610" rx="20" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
  <text x="82" y="374" class="section">MeetingMind NonProd VPC · 2 AZ private app subnets</text>
  <text x="82" y="398" class="note">ECS Fargate cluster · each service has its own Task Role / Security Group / CloudWatch Log Group (7-day retention)</text>
  <rect x="85" y="425" width="1175" height="205" rx="16" fill="#172554" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="110" y="456" class="section">ECS Services</text>
  <rect x="110" y="480" width="220" height="105" rx="10" class="service" filter="url(#shadow)"/><text x="220" y="513" text-anchor="middle" class="label">Web BFF</text><text x="220" y="536" text-anchor="middle" class="small label">Spring Session · CSRF</text><text x="220" y="558" text-anchor="middle" class="small label">allowlist proxy · :8081</text>
  <rect x="380" y="480" width="220" height="105" rx="10" class="service"/><text x="490" y="513" text-anchor="middle" class="label">Auth Service</text><text x="490" y="536" text-anchor="middle" class="small label">JWT/JWKS · refresh/revoke</text><text x="490" y="558" text-anchor="middle" class="small label">internal · :8082</text>
  <rect x="650" y="480" width="220" height="105" rx="10" class="service"/><text x="760" y="513" text-anchor="middle" class="label">Core Service</text><text x="760" y="536" text-anchor="middle" class="small label">Space · Meeting · ACL</text><text x="760" y="558" text-anchor="middle" class="small label">Report · Knowledge · :8080</text>
  <rect x="920" y="480" width="220" height="105" rx="10" class="service"/><text x="1030" y="513" text-anchor="middle" class="label">AI Service</text><text x="1030" y="536" text-anchor="middle" class="small label">Meeting AI · Project AI</text><text x="1030" y="558" text-anchor="middle" class="small label">FastAPI · :8000</text>
  <rect x="110" y="665" width="220" height="105" rx="10" class="service"/><text x="220" y="698" text-anchor="middle" class="label">Realtime STT</text><text x="220" y="721" text-anchor="middle" class="small label">LiveKit Egress · PCM · provider</text><text x="220" y="743" text-anchor="middle" class="small label">internal · :8083 · rollout gate</text>
  <path d="M1257 250 V425 H220 V480" class="blue"/><path d="M330 532 H380 M600 532 H650 M870 532 H920" class="blue"/><text x="355" y="520" class="note">BFF → Auth</text><text x="625" y="520" class="note">BFF → Core</text><text x="895" y="520" class="note">Core → AI</text><path d="M760 585 V620 H220 V665" class="blue"/><text x="380" y="610" class="note">Core → STT · service discovery + mTLS (target)</text>

  <rect x="85" y="805" width="1175" height="110" rx="16" fill="#10231f" stroke="#10b981" stroke-width="1.5"/>
  <text x="110" y="837" class="section">Service-owned data &amp; session state</text>
  <rect x="110" y="855" width="220" height="42" rx="8" class="data"/><text x="220" y="881" text-anchor="middle" class="label small">BFF Redis · Session + Vault</text>
  <rect x="380" y="855" width="220" height="42" rx="8" class="data"/><text x="490" y="881" text-anchor="middle" class="label small">Auth-owned PostgreSQL</text>
  <rect x="650" y="855" width="220" height="42" rx="8" class="data"/><text x="760" y="877" text-anchor="middle" class="label small">Core PostgreSQL + pgvector</text><text x="760" y="892" text-anchor="middle" class="tiny">AI retrieval / embedding schema</text>
  <rect x="920" y="855" width="220" height="42" rx="8" class="data"/><text x="1030" y="881" text-anchor="middle" class="label small">STT-owned DB (배포 전 검증)</text>
  <path d="M220 585 V855 M490 585 V855 M760 585 V855 M220 770 V855" class="line dashed"/>

  <rect x="1370" y="340" width="375" height="610" rx="20" fill="#1c1917" stroke="#f59e0b" stroke-width="2"/>
  <text x="1395" y="374" class="section" fill="#fbbf24">AWS Managed / External</text>
  <rect x="1400" y="420" width="315" height="70" rx="10" class="platform"/><text x="1557" y="449" text-anchor="middle" class="label">Secrets Manager + Parameter Store</text><text x="1557" y="471" text-anchor="middle" class="note">Task Role로 최소 권한 주입</text>
  <rect x="1400" y="520" width="315" height="70" rx="10" class="platform"/><text x="1557" y="549" text-anchor="middle" class="label">AWS KMS</text><text x="1557" y="571" text-anchor="middle" class="note">Token Vault envelope · RS256 signing</text>
  <rect x="1400" y="620" width="315" height="70" rx="10" class="platform"/><text x="1557" y="649" text-anchor="middle" class="label">ECR</text><text x="1557" y="671" text-anchor="middle" class="note">immutable Git SHA images</text>
  <rect x="1400" y="720" width="315" height="70" rx="10" class="platform"/><text x="1557" y="749" text-anchor="middle" class="label">NAT Gateway + S3 Gateway Endpoint</text><text x="1557" y="771" text-anchor="middle" class="note">private subnet outbound / assets</text>
  <rect x="1400" y="820" width="315" height="70" rx="10" class="platform"/><text x="1557" y="849" text-anchor="middle" class="label">CloudWatch Logs / Alarms</text><text x="1557" y="871" text-anchor="middle" class="note">service health · autoscaling</text>
  <path d="M1260 515 H1400 M1260 555 H1400" class="line dashed"/><path d="M1260 600 H1400" class="line dashed"/>

  <rect x="55" y="995" width="1690" height="85" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="1028" class="section">External providers</text>
  <rect x="350" y="1012" width="220" height="45" rx="8" class="external"/><text x="460" y="1040" text-anchor="middle" class="label small">LiveKit Cloud · WebRTC media</text>
  <rect x="650" y="1012" width="220" height="45" rx="8" class="external"/><text x="760" y="1034" text-anchor="middle" class="label small">CLOVA Speech</text><text x="760" y="1050" text-anchor="middle" class="tiny">selectable STT provider</text>
  <rect x="950" y="1012" width="220" height="45" rx="8" class="external"/><text x="1060" y="1040" text-anchor="middle" class="label small">외부 LLM API · AI provider</text>
  <path d="M220 250 C220 320 1100 300 1100 1012" class="blue dashed"/><text x="1120" y="942" class="note">Browser ↔ LiveKit Cloud: media plane direct; app API는 BFF 경유</text>
  <path d="M220 770 C220 950 760 950 760 1012" class="line dashed"/>
  <path d="M1030 585 C1030 800 1060 800 1060 1012" class="line dashed"/>

  <text x="80" y="1106" class="note">Legend: blue = request/data path · dashed = provider/operational dependency · green = persistent state · yellow = AWS platform control plane</text>
</svg>
