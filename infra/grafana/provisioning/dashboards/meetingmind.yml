apiVersion: 1

# dashboards 디렉터리의 JSON을 Grafana가 자동으로 읽어 등록한다.
# `foldersFromFilesStructure`를 쓰지 않고 단일 폴더로 둔다. 대시보드가 두 개뿐이다.
providers:
  - name: MeetingMind
    orgId: 1
    folder: MeetingMind
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
