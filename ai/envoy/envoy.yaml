# MeetingMind AI mTLS 종료 sidecar.
# 0.0.0.0:8000에서 client certificate를 필수로 요구하고 exact Core SPIFFE URI만
# RBAC로 허용한 뒤, 외부 XFCC를 제거(SANITIZE_SET)하고 검증된 URI만 다시 만들어
# loopback Uvicorn 127.0.0.1:8001로 전달한다. admin은 loopback에만 bind한다.
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: ai_mtls_ingress
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8000
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                  tls_maximum_protocol_version: TLSv1_3
                alpn_protocols:
                  - http/1.1
                tls_certificates:
                  - certificate_chain:
                      filename: /run/meetingmind/tls/tls.crt
                    private_key:
                      filename: /run/meetingmind/tls/tls.key
                validation_context:
                  trusted_ca:
                    filename: /run/meetingmind/tls/ca.crt
                  match_typed_subject_alt_names:
                    - san_type: URI
                      matcher:
                        exact: spiffe://meetingmind.internal/ns/nonprod-v2/sa/meetingmind-core
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ai_ingress
                codec_type: AUTO
                use_remote_address: true
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                forward_client_cert_details: SANITIZE_SET
                set_current_client_cert_details:
                  uri: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          time: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(:PATH)%"
                          status: "%RESPONSE_CODE%"
                          flags: "%RESPONSE_FLAGS%"
                          duration_ms: "%DURATION%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          peer_uri_san: "%DOWNSTREAM_PEER_URI_SAN%"
                http_filters:
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          allow-core-workload:
                            permissions:
                              - any: true
                            principals:
                              - authenticated:
                                  principal_name:
                                    exact: spiffe://meetingmind.internal/ns/nonprod-v2/sa/meetingmind-core
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: ai_local
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: local_uvicorn
                            timeout: 120s

  clusters:
    - name: local_uvicorn
      type: STATIC
      connect_timeout: 1s
      load_assignment:
        cluster_name: local_uvicorn
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8001
