spring:
  data:
    redis:
      port: ${BFF_REDIS_PORT:6380}

meetingmind:
  bff:
    downstream:
      core:
        read-timeout: ${BFF_CORE_READ_TIMEOUT:30s}
    session-cookie:
      name: ${BFF_SESSION_COOKIE_NAME:mm-session}
      secure: ${BFF_SESSION_COOKIE_SECURE:false}
    token-vault:
      key-provider: local
